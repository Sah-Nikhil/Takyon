[package]
name = "takyon-bench"
version = "0.10.0"
description = "Input injection and process-tree memory for `bun run bench`"
edition = "2021"

[[bin]]
name = "takyon-bench"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Every crate below is already in Cargo.lock via Tauri, so this helper adds
# nothing to the dependency graph (ADR-0026).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_ProcessStatus",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  "CGRemoteOperation",
] }
