[workspace]
members = ["uiaccess"]

[package]
name = "takyon"
version = "0.3.0"
description = "Takyon - a local-first keyboard launcher for Windows"
authors = ["Nikhil Sah <sah.nikhil11@gmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary's. Only an
# issue on Windows, which is the only platform this targets today.
# See https://github.com/rust-lang/cargo/issues/8519
name = "takyon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is not a default feature and the tray is not optional here: without
# it there is no way to quit an app whose only window is a hidden Palette.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
# A hotkey that failed to register has to be *reported* (IMPLEMENTATION_PLAN §7).
# The Palette is the wrong place to report it — if the binding is dead, the user
# never opens the Palette to read the message. Hence a native dialog.
tauri-plugin-dialog = "2"
# ADR-0011: the login registration is keyed by the neutral slug, not the display
# name. `Builder::app_name()` is what makes that possible without hand-rolling the
# registry write and losing the plugin's `StartupApproved` handling.
tauri-plugin-autostart = "2"
# Required *because of* autostart: "one from login, one double-clicked" goes from
# rare to routine, and two Takyons means two global-shortcut registrations, the
# second of which silently loses the race.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The fan-out in `query.rs` (§3). Sources are queried in parallel with a shared
# deadline; a scoped pool means a slow Source burns its own thread rather than
# blocking the one holding the IPC reply.
rayon = "1"
# `icons.bin` is read by offset arithmetic on a mapped page, never parsed. Reading
# it with normal file IO would put a syscall on the icon path for every row.
memmap2 = "0.9"
# Encoding extracted icons. WebView2 will not render a raw BGRA buffer, and PNG is
# the only lossless format it accepts that is also cheap to produce. MIT/Apache-2,
# so it stays clear of the GPL question that is still open (ADR-0005).
png = "0.17"
# `frecency.db` (v0.3), and the storage IMPLEMENTATION_PLAN §4 already specifies
# for settings and clips. `bundled` compiles SQLite in: no DLL to ship, find or
# version-match. MIT crate over a public-domain engine, so ADR-0005 stays open.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
# `mock_builder`/`get_ipc_response`, for the IPC contract test. **Must stay a
# dev-dependency**: cargo excludes those from `cargo build`, so `tauri build` is
# unaffected, and a `test` feature in a shipped binary is not noticed until it
# ships. See docs/tbc/0007.
tauri = { version = "2", features = ["test"] }

[target.'cfg(windows)'.dev-dependencies]
# Authoring `.lnk` fixtures for the Recents tests. Same version and a subset of
# the features the real dependency already asks for, so nothing extra compiles.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
] }

[target.'cfg(windows)'.dependencies]
# Pinned to the same major as Tauri's own dependency so the two share one compiled
# copy rather than each building their own.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
  # v0.2. `Win32_System_Com` carries CoInitializeEx and IPersistFile (which is how
  # a .lnk is loaded); `Win32_UI_Shell` carries IShellLinkW, IShellItem,
  # IEnumShellItems and IShellItemImageFactory — the last of which is the one API
  # that yields an icon for a Win32 exe and a UWP package alike, so the icon path
  # does not fork by app kind. `Win32_Graphics_Gdi` is needed to get the pixels
  # back out of the HBITMAP it hands over.
  "Win32_Graphics_Gdi",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  # "Copy path" writes to the clipboard directly rather than through
  # `tauri-plugin-clipboard-manager`. One action is not worth a plugin, a
  # capability entry and a second way for the frontend to reach the OS — and
  # ADR-0009 wants the number of things the webview can ask for kept small.
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
] }

[profile.release]
# The product *is* the latency budget. LTO and a single codegen unit are the two
# cheapest things that move it, and `panic = "abort"` removes unwinding tables
# from a process whose panic policy is "die visibly" anyway.
lto = true
codegen-units = 1
panic = "abort"
strip = true
