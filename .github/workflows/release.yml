name: release

# Runs on a pushed `v*` tag. Cut a release by bumping the version
# (`bun run bump`), committing, then pushing the commit and its tag together —
# CI has to have run on the same commit, see `preflight`.
#
# Signs the Windows installer for the in-app updater and publishes `latest.json`
# beside it (ADR-0040). Needs, from Settings > Secrets and variables > Actions:
#   secret   TAURI_SIGNING_PRIVATE_KEY            contents of the minisign .key file
#   secret   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   its password (empty if it has none)
#   variable TAKYON_UPDATER_PUBKEY                contents of the matching .key.pub
# The secrets reach `tauri build` alone and are never echoed. Setup steps:
# docs/verify/updater.md, section S.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  preflight:
    name: Verify the tag and wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      # All five version files move together (`bun run bump`), and
      # tauri.conf.json is the one the installer filename is built from.
      - name: Verify the tag matches the repo version
        run: |
          V=$(bun -e "console.log(require('./apps/desktop/src-tauri/tauri.conf.json').version)")
          if [ "v$V" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v$V"
            exit 1
          fi

      # Before the hour-long wait, not after it. A missing secret or a malformed
      # pubkey would otherwise fail the build job, or publish a feed no installed
      # copy can verify. Tests presence only; nothing here prints a value.
      - name: Check the updater signing setup
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAKYON_UPDATER_PUBKEY: ${{ vars.TAKYON_UPDATER_PUBKEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not set. See docs/verify/updater.md, section S."
            exit 1
          fi
          bun scripts/updater.ts config "$RUNNER_TEMP/updater.conf.json"

      - name: Find this commit's CI run
        id: ci_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --jq '[.check_runs[] | select(.name | startswith("Typecheck") or startswith("cargo test") or startswith("Playwright"))] | length')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # Refused rather than run inline, unlike tesseract's. Most CI jobs need a
      # Windows runner, so an inline fallback here could only ever re-run the
      # TypeScript layer — and would then report a release as checked while the
      # Rust core and every screenshot went untested.
      - name: Refuse a tag whose commit never ran CI
        if: steps.ci_run.outputs.count == '0'
        run: |
          echo "No CI run on ${GITHUB_SHA}. Push the commit to main first, then the tag."
          exit 1

      # Every CI job but the bench, so the live web search tests gate a release
      # too, as CLAUDE.md asks. 60 minutes: CI's bench job is a full release
      # build, and the run it belongs to finishes with it.
      - name: Wait for CI to pass on this commit
        timeout-minutes: 60
        uses: lewagon/wait-on-check-action@1d57e2c51a58d812d2765e036a028b6bdb5a6154 # v1.8.1
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30
          # The job's `name:`, not its id. The action skips the check whose name
          # matches exactly; `preflight` matched nothing, so it waited on itself
          # until the step timed out.
          running-workflow-name: Verify the tag and wait for CI
          # Bench not gating yet: never passed on a hosted runner (TBC-0015).
          # Release's own jobs ignored too: a failed tag leaves them `skipped`
          # on the commit, and every later tag on it would refuse forever.
          ignore-checks: Performance bench (Windows),Build the Windows installer,Build the macOS app (Apple Silicon, not yet portable),Publish the GitHub release
          allowed-conclusions: success

  build-windows:
    name: Build the Windows installer
    needs: preflight
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # In step with rust-toolchain.toml and ci.yml.
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          # Release profile, warmed on main by ci.yml's `bench` job.
          shared-key: rust-desktop-release
      - uses: actions/cache@v6
        with:
          path: ~\.bun\install\cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # The pubkey and feed are merged in here rather than committed, so local
      # and bench builds need no key and report updates as off (ADR-0040).
      - name: Write the updater build config
        shell: bash
        env:
          TAKYON_UPDATER_PUBKEY: ${{ vars.TAKYON_UPDATER_PUBKEY }}
        run: bun scripts/updater.ts config "$RUNNER_TEMP/updater.conf.json"
      # `tauri build`, never a bare `cargo build --release`. A bare cargo build
      # produces a takyon.exe that launches, registers the hotkey and shows the
      # Palette with a completely dead frontend (CLAUDE.md, Gotchas). The signing
      # key exists in this step's environment only; tauri writes the `.sig`.
      - name: Build and sign the installer
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run build --config "$RUNNER_TEMP/updater.conf.json"
      # The app's own check, run here first: a secret and pubkey from two key
      # pairs would publish an update every installed copy refuses.
      - name: Verify the installer signature
        shell: bash
        env:
          TAKYON_UPDATER_PUBKEY: ${{ vars.TAKYON_UPDATER_PUBKEY }}
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          for f in *-setup.exe; do bun "$GITHUB_WORKSPACE/scripts/updater.ts" verify "$f"; done
      # `sha256sum` format, two spaces, so `sha256sum -c` verifies it directly.
      # Same file `bun run release` writes locally.
      - name: Record the installer hash
        shell: bash
        run: |
          cd apps/desktop/src-tauri/target/release/bundle/nsis
          for f in *-setup.exe; do sha256sum "$f"; done > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: windows-nsis
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            apps/desktop/src-tauri/target/release/bundle/nsis/SHA256SUMS.txt

  # There is no macOS build yet, and this job cannot succeed until there is:
  # `search::fetch` is WinHTTP (ADR-0019), the clipboard key is DPAPI, the file
  # index is `ReadDirectoryChangesW` and the app source is COM. docs/plans/v0.12-macos.md
  # states what the port needs and in what order.
  #
  # Wired up anyway, and off by default: set the repository variable
  # MACOS_BUILD to `true` once the port compiles and this releases a .dmg
  # without another edit here. `continue-on-error` so it can never gate the
  # Windows release even after it is switched on.
  build-macos:
    name: Build the macOS app (Apple Silicon, not yet portable)
    needs: preflight
    if: vars.MACOS_BUILD == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # In step with rust-toolchain.toml and ci.yml.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          shared-key: rust-desktop-mac
      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-cache-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      # `--config` bundles THIRD_PARTY_NOTICES.txt, as the root `build` script does.
      - run: bun --cwd=apps/desktop run tauri build --config src-tauri/tauri.bundle.conf.json --target aarch64-apple-darwin
      - name: Record the disk image hash
        run: |
          cd apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          for f in *.dmg; do shasum -a 256 "$f"; done > SHA256SUMS-macos.txt
          cat SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          if-no-files-found: warn
          path: |
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS-macos.txt

  publish:
    name: Publish the GitHub release
    # `always()` plus an explicit Windows check: build-macos is skipped whenever
    # MACOS_BUILD is unset, and a skipped dependency would otherwise cancel this.
    needs: [build-windows, build-macos]
    if: always() && needs.build-windows.result == 'success'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # For scripts/updater.ts and CHANGELOG.md. No `bun install`: the script
      # imports nothing outside the repo.
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist
      - run: ls -la dist
      # Verifies the signature again before writing the feed. Windows only: the
      # macOS job builds no updater artefact (ADR-0040).
      - name: Write latest.json and the release notes
        env:
          TAKYON_UPDATER_PUBKEY: ${{ vars.TAKYON_UPDATER_PUBKEY }}
        run: bun scripts/updater.ts manifest dist "${GITHUB_REF_NAME#v}" "$RUNNER_TEMP/notes.md"
      # CHANGELOG.md's section leads; GitHub's generated "What's Changed" and
      # "New Contributors" follow it (softprops appends them to `body_path`).
      # .github/release.yml credits outside contributors without naming owner.
      - name: Assemble the release body
        run: |
          {
            cat "$RUNNER_TEMP/notes.md"
            echo
            echo "---"
            echo
            echo 'Verify a download with `sha256sum -c SHA256SUMS.txt`.'
            echo
            echo "Installed copies check daily unless disabled in Settings > About; updates can also be checked there on demand."
            echo 'The installer has an updater signature (`.sig`), checked before it runs; `latest.json` is the update feed.'
          } > "$RUNNER_TEMP/body.md"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body_path: ${{ runner.temp }}/body.md
